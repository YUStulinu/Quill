[package]
name = "quill"
version = "0.1.0"
edition = "2024"
description = "A statically typed language with Hindley-Milner type inference, compiled to x86-64 machine code"
license = "MIT"
repository = "https://github.com/YUStulinu/Quill"
readme = "README.md"
keywords = ["compiler", "language", "type-inference", "ssa", "x86-64"]
categories = ["compilers"]

[dependencies]
lsp-server = "0.10.0"
lsp-types = "0.97.0"
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 4

# The interpreter-based tests run much faster with optimizations, and keep their debug assertions.
[profile.test]
opt-level = 2
